<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY PORTFOLIO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #f0f4f8);
            color: #333;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8em;
            font-weight: bold;
            color: #0d3b66;
            text-decoration: none;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            margin-left: 30px;
            padding-bottom: 5px;
            transition: all 0.3s;
        }

        nav a.active,
        nav a:hover {
            color: #f10000;
            border-bottom: 2px solid #f10000;
        }

        /* Home Section */
        .home {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            padding: 80px 20px;
            max-width: 1200px;
            margin: 0 auto;
            gap: 40px;
        }

        .home-Img img {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transition: transform 0.3s;
        }

        .home-Img img:hover {
            transform: scale(1.05);
        }

        .home-content {
            max-width: 600px;
        }

        .home-content h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            color: #0d3b66;
        }

        .home-content h1 span {
            color: #f10000;
        }

        .typing-text {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
        }

        .home-content p {
            font-size: 1.1em;
            line-height: 1.8;
            color: #555;
            margin-bottom: 30px;
        }

        /* Social Icons */
        .social-icons a {
            display: inline-block;
            margin-right: 15px;
            font-size: 1.5em;
            color: #0d3b66;
            transition: all 0.3s;
        }

        .social-icons a:hover {
            color: #f10000;
            transform: scale(1.2);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .home {
                flex-direction: column;
                text-align: center;
            }

            .home-content h1 {
                font-size: 2em;
            }

            .typing-text {
                font-size: 1.2em;
            }

            .home-Img img {
                width: 200px;
                height: 200px;
            }

            nav a {
                margin-left: 15px;
            }
        }
    </style>
</head>
<body>
    <header>
       <a href="index.html" class="logo">PRAVEEN MEYYAPPAN</a> 
       <nav>
        <a href="index.html" class="active">HOME</a>
        <a href="education.html">EDUCATION</a>
        <a href="skills.html">SKILLS</a>
        <a href="experience.html">EXPERIENCE</a>
        <a href="contact.html">CONTACT</a>
       </nav>
    </header>

    <section class="home">
        <div class="home-Img">
            <img src="c:\Users\manim\OneDrive\文件\html ,css\praveen.png" alt="Profile Image">
        </div>

        <div class="home-content">
            <h1>Hi, It's <span>PRAVEEN</span></h1>
            <h3 class="typing-text">I'm a <span>Web Developer</span></h3>
            <p>With solid expertise in HTML, CSS, and JavaScript, I create visually appealing and functional web interfaces.
            I focus on performance, responsiveness, and delivering high-quality user experiences.</p>

            <div class="social-icons">
                <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
                <a href="#"><i class="fa-brands fa-square-instagram"></i></a>
            </div>
        </div>
    </section>
</body>
</html>
